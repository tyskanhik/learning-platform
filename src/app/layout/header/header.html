<mat-toolbar color="primary" class="mat-elevation-z4" role="banner" data-cy="header">
  <a routerLink="/" class="logo-link" aria-label="Home" data-cy="logo-link">
    <span>{{ 'header.title' | transloco }}</span>
  </a>
  
  <span class="spacer" aria-hidden="true"></span>
  
  <nav class="nav-actions" role="navigation">
    <!-- Переключатель языка -->
    <button 
      mat-icon-button 
      [matMenuTriggerFor]="languageMenu"
      [attr.aria-label]="'Switch language'"
      data-cy="language-switcher"
    >
      <mat-icon>language</mat-icon>
    </button>
    <mat-menu #languageMenu="matMenu" data-cy="language-menu">
      <button mat-menu-item (click)="switchLanguage('ru')" [class.active]="currentLang() === 'ru'" data-cy="language-ru">
        <span>🇷🇺 Русский</span>
      </button>
      <button mat-menu-item (click)="switchLanguage('en')" [class.active]="currentLang() === 'en'" data-cy="language-en">
        <span>🇺🇸 English</span>
      </button>
    </mat-menu>

    @if (currentUser(); as user) {
      <button 
        mat-button 
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'User menu'"
        data-cy="user-menu"
      >
        <mat-icon>account_circle</mat-icon>
        <span class="user-name" data-cy="user-name">{{ user.firstName }}</span>
      </button>
      <mat-menu #userMenu="matMenu" data-cy="user-menu-dropdown">
        <button mat-menu-item routerLink="/profile" data-cy="profile-link">
          <mat-icon>person</mat-icon>
          <span>{{ 'header.profile' | transloco }}</span>
        </button>
        @if (user.role === 'teacher') {
          <button mat-menu-item routerLink="/create-course" data-cy="create-course-link">
            <mat-icon>add_circle</mat-icon>
            <span>{{ 'header.create_course' | transloco }}</span>
          </button>
        }
        <button mat-menu-item (click)="onLogout()" data-cy="logout-btn">
          <mat-icon>logout</mat-icon>
          <span>{{ 'header.logout' | transloco }}</span>
        </button>
      </mat-menu>
    } @else {
      <button mat-button routerLink="/login" data-cy="login-btn">
        <mat-icon>login</mat-icon>
        <span>{{ 'header.login' | transloco }}</span>
      </button>
      <button mat-raised-button color="accent" routerLink="/register" data-cy="register-btn">
        <mat-icon>person_add</mat-icon>
        <span>{{ 'header.register' | transloco }}</span>
      </button>
    }
  </nav>
</mat-toolbar>
